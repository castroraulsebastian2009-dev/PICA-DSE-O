<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrera de Ciencias | CienciaLab</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }

        /* BARRA DE NAVEGACIÓN */

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(7, 17, 31, 0.96);
            backdrop-filter: blur(12px);
            box-shadow: 0 3px 20px rgba(0,0,0,0.25);
        }

        nav {
            max-width: 1250px;
            margin: auto;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #38bdf8;
        }

        .menu {
            display: flex;
            list-style: none;
            gap: 5px;
            align-items: center;
        }

        .menu a {
            color: white;
            text-decoration: none;
            padding: 10px 13px;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 14px;
        }

        .menu a:hover {
            background: #38bdf8;
            color: #07111f;
        }

        .menu-principal {
            border: 1px solid #38bdf8;
            color: #38bdf8 !important;
        }

        .menu-principal:hover {
            color: #07111f !important;
        }

        /* PORTADA */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 80px;

            background:
                linear-gradient(
                    rgba(3,15,30,0.76),
                    rgba(3,15,30,0.88)
                ),
                url("imagenes/2017-08-04.jpg");

            background-size: cover;
            background-position: center;
            color: white;
        }

        .hero-content {
            max-width: 900px;
        }

        .mini-title {
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(45px, 7vw, 82px);
            line-height: 1;
            margin-bottom: 25px;
        }

        .hero h1 span {
            color: #38bdf8;
            display: block;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.7;
            color: #dbeafe;
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            padding: 15px 27px;
            border-radius: 30px;
            background: #38bdf8;
            color: #07111f;
            text-decoration: none;
            font-weight: bold;
            margin: 5px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(56,189,248,0.4);
        }

        .btn.secondary {
            background: transparent;
            border: 2px solid white;
            color: white;
        }

        /* SECCIONES */

        section {
            padding: 100px 20px;
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 55px;
        }

        .section-title h2 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .section-title h2 span {
            color: #0284c7;
        }

        .section-title p {
            color: #64748b;
            font-size: 18px;
        }

        /* INFORMACIÓN */

        .about {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 55px;
            align-items: center;
        }

        .about img {
            width: 100%;
            height: 420px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .about-text h3 {
            font-size: 31px;
            margin-bottom: 20px;
        }

        .about-text p {
            line-height: 1.9;
            color: #526176;
            margin-bottom: 17px;
        }

        /* ÁREAS */

        .areas {
            background: #f1f8f6;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.14);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 25px;
        }

        .card-content h3 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .card-content p {
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 18px;
        }

        /* GALERÍA */

        .gallery {
            background: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery-grid img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 15px;
            transition: 0.3s;
        }

        .gallery-grid img:hover {
            transform: scale(1.03);
        }

        /* CONTACTO */

        .contact {
            background: #07111f;
            color: white;
        }

        .contact .section-title p {
            color: #cbd5e1;
        }

        .contact-content {
            max-width: 750px;
            margin: auto;
            text-align: center;
        }

        .contact-content p {
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        /* PIE DE PÁGINA */

        footer {
            background: #030712;
            color: #94a3b8;
            padding: 25px 20px;
            text-align: center;
        }
